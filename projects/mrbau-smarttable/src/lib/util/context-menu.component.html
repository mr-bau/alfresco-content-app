<div  *ngIf="visible" #contextMenuPanel id="contextMenuPanel"
      [style.left.px]="posLeft"
      [style.top.px]="posTop"
      @fadeIn
      >
  <div id="contextMenuHeader">
    <h1>{{title}}</h1>
    <button cButtonClose (click)="closeButtonClicked($event)"></button>
  </div>
  <div id="contextMenuSearch">
    <c-input-group class="mb-3" class="flex-nowrap">
      <span cInputGroupText id="searchIcon"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg></span>
      <input #searchInputField aria-label="suchen"
        cFormControl
        placeholder="Suchen"
        (keyup)="onSearchKeypressEvent($event)"
        type="text">
    </c-input-group>
  </div>
  <div id="contextMenuList">
    <mrbau-loaderoverlay *ngIf="loaderVisible"></mrbau-loaderoverlay>
    @for (item of filteredList; track item) {
      <div>
        <c-form-check>
          <input cFormCheckInput [checked]="item.checked" (change)="onCheckboxChanged($event)" id="{{item.id}}" type="checkbox" />
          <label cFormCheckLabel for="{{item.id}}">{{item.name | translate}}</label>
        </c-form-check>
      </div>
    }
  </div>
  <div id="contextMenuButtons">
    <button cButton color="light" (click)="resetData()">Reset</button>
    <button class="ms-2" cButton (click)="applyData()">Anwenden</button>
  </div>
</div>
