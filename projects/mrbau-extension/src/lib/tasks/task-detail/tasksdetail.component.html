<div class="tasks-detail-main" >
  <mrbau-errormsgpane [errorMessage]="errorMessage"></mrbau-errormsgpane>

  <div *ngIf="task != null; else noTask">
    <mat-accordion multi="true">
      <!-- common task panel -->
      <div *ngIf="this.task && this.task.isCommonTask()">
        <mrbau-task-detail-common [task]="this.task" (fileSelectEvent)="fileSelected($event)" (taskChangeEvent)="taskChanged($event)" (errorEvent)="errorMessage=$event"></mrbau-task-detail-common>
      </div>
      <!-- new document task -->
      <div *ngIf="this.task && this.task.isNewDocumentTask()">
        <mrbau-tasks-detail-new-document [task]="this.task" (fileSelectEvent)="fileSelected($event)" (taskChangeEvent)="taskChanged($event)" (errorEvent)="errorMessage=$event"/>
      </div>

    </mat-accordion>

    <div class="status addMarginTop">
      Task: {{this.task.category | mrbauTaskCategory}} - ID {{this.task.id }} - erzeugt am {{this.task.createdDate | date:'medium'}} von {{this.task.createdUser.displayName}}
    </div>
  </div>

  <ng-template #noTask>
    <div class="task-description">
      Please select a task to see details.
    </div>
  </ng-template>

</div>
