<div id="pdf-container">
  <mrbau-errormsgpane [errorMessage]="errorMessage"></mrbau-errormsgpane>
  <div>
    <mat-button-toggle-group [value]="useViewer" aria-label="Favorite Color" (valueChange)="onViewerChanged($event)">
      <mat-button-toggle value="pdfTron">Editor</mat-button-toggle>
      <mat-button-toggle value="browser">Browser</mat-button-toggle>
      <mat-button-toggle value="aca">ACA-Viewer</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <div *ngIf='(fileSelectDataOut==null || dragging)'>
    <div class="center">
      <img class="preview-icon" src="./assets/images/ft_ic_pdf.svg" alt="PDF Icon" width="500px">
      <p class="preview-text">Document Preview</p>
    </div>
  </div>
  <div id="pdf-viewer">
    <mrbau-pdfbrowser *ngIf="isPDFFile && useViewer==PDF_BROWSER" [hidden]="(fileSelectDataOut==null || dragging)" id="pdf-frame" [reloadToken]="browserReloadToken" [fileSelectData]="fileSelectDataOut"></mrbau-pdfbrowser>
    <mrbau-pdftron #pdfTron *ngIf="isPDFFile && useViewer==PDF_TRON" [hidden]="(fileSelectDataOut==null || dragging)" [fileSelectData]="fileSelectDataOut"/>
    <adf-alfresco-viewer *ngIf="acaViewerReloadFlag && (!isPDFFile || useViewer==PDF_ACA)"
      [overlayMode]="false"
      [allowLeftSidebar]="false"
      [allowFullScreen]="true"
      [allowRightSidebar]="false"
      [allowGoBack]="false"
      [showToolbar]="true"
      [nodeId]="fileSelectDataOut?.nodeId || ''"
      [versionId]="fileSelectDataOut?.versionId || ''"
      [hidden]="(fileSelectDataOut==null || dragging)"
    >
      <!--
      <adf-viewer-extension [supportedExtensions]="['pdf']" #extension>
        <ng-template let-urlFileContent="urlFileContent">
          <embed *ngIf="!useIframe" id="pdf-frame" type="application/pdf" width="100%" height="100%" [src]="sanitized_document_url">
          <iframe *ngIf="useIframe" id="pdf-frame" type="application/pdf" width="100%" height="100%" [src]="sanitized_document_url" ></iframe>
        </ng-template>
      </adf-viewer-extension>
      -->
    </adf-alfresco-viewer>
  </div>
</div>
