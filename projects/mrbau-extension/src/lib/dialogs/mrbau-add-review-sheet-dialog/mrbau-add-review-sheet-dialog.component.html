  <h2 mat-dialog-title>{{title}} {{subtitle}}</h2>
  <mrbau-errormsgpane [errorMessage]="errorMessage"></mrbau-errormsgpane>

      <div class="container5 borderbot1">

      <div class="container4-4512">

      <div class="container7-1">

        <div></div>
        <div></div>

        <mat-form-field class="form-field-number small-input"><input mrbauNumberInput id="bauschaedennetto" matInput type="text" formControlName="bauschaedennetto" placeholder="0,00"></mat-form-field>

      <div class="container7-1">

      <div class="container7-1">

      <div class="container7-1">
        <div></div>
        <label class="label">- Wasser</label>
        <mat-form-field class="form-field-number small-input"><input mrbauNumberInput id="wasserprozent" matInput type="text" formControlName="wasserprozent" placeholder="0,00"></mat-form-field>
        <label class="label">% von</label>
        <mat-form-field class="form-field-number readonly small-input"><input mrbauNumberInput id="sumnetto1ref4" matInput type="text" formControlName="sumnetto1ref4" placeholder="0,00" readonly></mat-form-field>

      <div class="container7-1">

      <div class="container4-4512 borderbot1">

        <div></div>

        <div></div>
        <label for="ustsumnetto2" class="label">€</label>

        <mat-form-field class="form-field-number readonly small-input"><input mrbauNumberInput id="brutto2" matInput type="text" formControlName="brutto2" placeholder="0,00" readonly></mat-form-field>

          <div></div>
          <label for="teilznetto" class="label">Netto €</label>
          <mat-form-field class="form-field-number small-input"><input mrbauNumberInput id="teilznetto" matInput type="text" formControlName="teilznetto" placeholder="0,00"></mat-form-field>

      <div  *ngIf="!isBauleistungsRechnung()" class="container4-4512">

      <div  *ngIf="!isBauleistungsRechnung()" class="container4-4512">

      <div class="container4-4512 borderbot1">
          <label class="label">Einbehalt / Gegenverrechnung</label>
          <div></div>
          <label for="einbehalt" class="label">€</label>
          <mat-form-field  class="form-field-number small-input"><input mrbauNumberInput id="einbehalt" matInput type="text" formControlName="einbehalt" placeholder="0,00"></mat-form-field >
      </div>
      <div *ngIf="isTeilRechnung()" class="container7 borderbot1">

        <div></div>

  <mat-dialog-actions>
    <!-- The mat-dialog-close directive optionally accepts a value as a result for the dialog. -->
    <button mat-button color="primary" (click)="createPDFDocument()" [disabled]="saveButtonDisabled()">PRÜFBLATT GENERIEREN</button>
    <button mat-button color="primary" (click)="saveDocumentData()" [disabled]="saveButtonDisabled()">NUR SPEICHERN</button>
    <button mat-button color="primary" (click)="test(1)" [disabled]="saveButtonDisabled()">TR Netto</button>
    <button mat-button color="primary" (click)="test(2)" [disabled]="saveButtonDisabled()">TR Brutto</button>
    <button mat-button color="primary" (click)="test(3)" [disabled]="saveButtonDisabled()">SR Netto</button>
    <button mat-button color="primary" (click)="test(4)" [disabled]="saveButtonDisabled()">SR Brutto</button>
    <button mat-button mat-dialog-close>ABBRECHEN</button>
  </mat-dialog-actions>
